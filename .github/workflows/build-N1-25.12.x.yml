name: Build 25.12.x N1 DHCP

on:
  push:
    branches: [n1-25-dhcp]
    paths:
      - 'n1/build25.sh'
      - 'n1/packages25.sh'
      - 'n1/files/**'
      - 'n1/verify-image.sh'
      - '.github/workflows/build-N1-25.12.x.yml'
  workflow_dispatch:
    inputs:
      luci_version:
        description: 'ImmortalWrt 版本（与此前 x86 25.12.1 保持一致）'
        type: choice
        default: '25.12.1'
        options: ['25.12.1', '25.12.2']
      openwrt_kernel:
        description: 'N1 内核系列（使用 ophub stable 最新补丁）'
        type: choice
        default: '6.12.y'
        options: ['6.12.y', '6.6.y', '6.1.y']
      include_passwall2:
        description: '集成 PassWall2 备用；不要与 OpenClash 同时启用透明代理'
        type: choice
        default: 'yes'
        options: ['yes', 'no']
      include_docker:
        description: '集成 Docker（N1 仅 2GB 内存，默认关闭）'
        type: choice
        default: 'no'
        options: ['no', 'yes']
      rootfs_partsize:
        description: 'N1 rootfs 分区大小 MiB；Docker 数据需另挂外置盘'
        type: choice
        default: '1024'
        options: ['1024', '2048']

permissions:
  contents: read

concurrency:
  group: n1-25-${{ github.ref }}
  cancel-in-progress: true

env:
  LUCI_VERSION: ${{ inputs.luci_version || '25.12.1' }}
  N1_KERNEL: ${{ inputs.openwrt_kernel || '6.12.y' }}
  INCLUDE_PASSWALL2: ${{ inputs.include_passwall2 || 'yes' }}
  INCLUDE_DOCKER: ${{ inputs.include_docker || 'no' }}
  ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize || '1024' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install N1 packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs dosfstools parted gdisk e2fsprogs \
            util-linux kmod device-tree-compiler pigz jq python3 zstd unzip \
            wget gawk pv zip rename uuid-runtime qemu-user-static
          bash -n n1/build25.sh n1/packages25.sh n1/verify-image.sh
          sh -n n1/files/etc/uci-defaults/zz-n1-dhcp

      - name: Build ImmortalWrt 25 ARM64 rootfs with selected APKs
        run: |
          set -euo pipefail
          mkdir -p bin
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE/bin:/home/build/immortalwrt/bin" \
            -v "$GITHUB_WORKSPACE/n1:/n1:ro" \
            -e INCLUDE_DOCKER -e INCLUDE_PASSWALL2 \
            "immortalwrt/imagebuilder:armsr-armv8-openwrt-${LUCI_VERSION}" \
            /bin/bash /n1/build25.sh 2>&1 | tee bin/n1-imagebuilder.log

      - name: Locate generated rootfs
        id: rootfs
        run: |
          set -euo pipefail
          mapfile -t files < <(find bin/targets/armsr/armv8 -type f -name '*rootfs.tar.gz')
          test "${#files[@]}" -eq 1
          echo "file=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Package Phicomm N1 image with matching kernel and DTB
        # Pin the packager whose APK and N1 support were checked for this branch.
        uses: ophub/amlogic-s9xxx-openwrt@c7578a7699ad2c002eca81e4b131b5c73c708845
        with:
          openwrt_path: ${{ steps.rootfs.outputs.file }}
          openwrt_board: s905d
          kernel_repo: ophub/kernel
          kernel_usage: stable
          openwrt_kernel: ${{ env.N1_KERNEL }}
          auto_kernel: true
          openwrt_size: 384/${{ env.ROOTFS_PARTSIZE }}
          builder_name: heyyyss

      - name: Verify packaged image and DHCP defaults
        run: |
          sudo bash n1/verify-image.sh "$PACKAGED_OUTPUTPATH" "$GITHUB_WORKSPACE/bin"
          sudo chown -R "$(id -u):$(id -g)" bin

      - name: Upload N1 firmware and verification report
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.LUCI_VERSION }}-phicomm-n1-dhcp-${{ github.run_number }}
          path: |
            bin/n1-firmware/*
            bin/n1-build-inputs.txt
            bin/targets/armsr/armv8/*.manifest
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-25-build-log-${{ github.run_number }}
          path: |
            bin/n1-imagebuilder.log
            bin/n1-build-inputs.txt
          if-no-files-found: ignore
          retention-days: 14
